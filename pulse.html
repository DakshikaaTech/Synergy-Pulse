 <!DOCTYPE html>
 <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Synergy Pulse | Command Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudfare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(5, 11, 20, 0.65), rgba(9, 13, 26, 0.85)), url('') no-repeat center center/cover;
            z-index: -1;
            filter: saturate(1.3) brightness(0.85);
            transition: background-image 0.5s ease-in-out;
        }

        header{
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            z-index: 2;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .datetime-box {
            text-align: right;
        }

        .time {
            font-size: 24px;
            font-weight: 700;
            font-family: monospace;
            color: #f8fafc;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .date {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 2;
            margin: auto 0;
        }

        .welcome-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .welcome-title span{
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .search-form {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.1);
            background: rgba(15, 23, 42, 0.95);
        }

        .search-input::placeholder{
            color: #94a3b8;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: #38bdf8;
            font-size: 18px;
            pointer-events: none;
        }

        .social-bar {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #f8fafc;
            padding: 10px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover{
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #38bdf8;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            z-index: 2;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8)
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
                padding: 20px;
            }
            .datetime-box {
                text-align: center;
            }
        }
    </style>

</head>


 </html>
