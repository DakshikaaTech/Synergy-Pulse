<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Pulse | Command Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(5, 11, 20, 0.65), rgba(9, 13, 26, 0.85)), url('') no-repeat center center/cover;
            z-index: -1;
            filter: saturate(1.3) brightness(0.85);
            transition: background-image 0.5s ease-in-out;
        }

        header {
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            z-index: 2;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .datetime-box {
            text-align: right;
        }

        .time {
            font-size: 24px;
            font-weight: 700;
            font-family: monospace;
            color: #f8fafc;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .date {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .main-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 2;
            margin: auto 0;
            gap: 20px;
        }

        .side-widget {
            width: 260px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .widget-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 8px;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .weather-temp {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
        }

        .todo-input-box {
            display: flex;
            gap: 6px;
        }

        .todo-input {
            flex: 1;
            background: rgba(5, 11, 20, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 6px 10px;
            color: #f8fafc;
            font-size: 12px;
            outline: none;
        }

        .todo-add-btn {
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #050b14;
            padding: 6px 10px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .todo-add-btn:hover {
            opacity: 0.85;
        }

        .todo-list {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .todo-item {
            background: rgba(5, 11, 20, 0.4);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .todo-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 11px;
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 2;
            margin: auto 0;
        }

        .welcome-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .welcome-title span {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .search-form {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.1);
            background: rgba(15, 23, 42, 0.95);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: #38bdf8;
            font-size: 18px;
            pointer-events: none;
        }

        .social-bar {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #f8fafc;
            padding: 10px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #38bdf8;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .news-ticker {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
            margin-bottom: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            z-index: 2;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
            }
            .side-widget {
                width: 100%;
                max-width: 650px;
            }
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
                padding: 20px;
            }
            .datetime-box {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <script src="config.js"></script>

    <div class="bg-container" id="apodBg"></div>
    <header>
        <div class="brand"><i class="fa-solid fa-bolt"></i>Synergy Pulse</div>
        <div class="datetime-box">
            <div class="time" id="clockDisplay">00:00:00</div>
            <div class="date" id="dateDisplay">Loading date....</div>
        </div> 
    </header>

    <div class="main-wrapper">
        <div class="side-widget">
            <div class="widget-title"><i class="fa-solid fa-cloud-sun"></i> Weather Hub</div>
            <div class="weather-info" id="weatherWidgetContent">
                <div class="weather-temp">--°C</div>
                <div>Fetching telemetry...</div>
            </div>
        </div>

        <div class="main-container">
            <h1 class="welcome-title">Synergy<span>Pulse</span></h1>
            <form class="search-form" action="https://www.google.com/search" method="GET" target="_blank">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" name="q" class="search-input" placeholder="Search the web or type a command..." autocomplete="off">
            </form>

            <div class="social-bar">
                <a href="https://github.com" target="_blank" class="social-btn">
                    <i class="fa-brands fa-github"></i> Github
                </a>
                <a href="https://linkedin.com" target="_blank" class="social-btn">
                    <i class="fa-brands fa-linkedin-in"></i> LinkedIn
                </a>
                <a href="https://instagram.com" target="_blank" class="social-btn">
                    <i class="fa-brands fa-instagram"></i> Instagram
                </a>
                <a href="https://youtube.com" target="_blank" class="social-btn">
                    <i class="fa-brands fa-youtube"></i> Youtube
                </a>
            </div>
        </div>

        <div class="side-widget">
            <div class="widget-title"><i class="fa-solid fa-list-check"></i> Command Tasks</div>
            <div class="todo-input-box">
                <input type="text" id="todoInput" class="todo-input" placeholder="Add directive...">
                <button id="todoAddBtn" class="todo-add-btn"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <div class="news-ticker" id="newsTickerContainer">
        <div class="news-badge"><i class="fa-solid fa-rss"></i>Live News</div>
        <div class="news-content" id="newsContent">
            <span class="news-link">Loading global feed</span>
        </div>
    </div>

    <footer>
        <span id="apodTitle">NASA APOD Telemetry Active</span> &bull; Synergy Systems Online
    </footer>

    <script>
        function updateDateTime() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = now.toLocaleTimeString();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString(undefined, options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        async function loadNASAAPOD() {
            try {
                const apiKey = (typeof CONFIG !== 'undefined' && CONFIG.NASA_API_KEY) ? CONFIG.NASA_API_KEY : 'DEMO_KEY';
                const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}`);
                const data = await res.json();

                if (data.media_type === 'image') {
                    const bgContainer = document.getElementById('apodBg');
                    bgContainer.style.backgroundImage = `linear-gradient(rgba(5,11,20,0.65), rgba(9, 13, 26, 0.85)), url('${data.url}')`;
                    document.getElementById('apodTitle').textContent = `NASA APOD: ${data.title}`;
                }
            } catch (error) {
                console.error("Failed to load NASA APOD, fallback background active.", error);
            }
        }

        loadNASAAPOD();

        async function loadNewsFeed() {
            try {
                const rssUrl = 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en';
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await res.json();

                if (data.status === 'ok' && data.items.length > 0){
                    const articles = data.items;
                    let currentIndex = 0;
                    const newsContainer = document.getElementById('newsContent');

                    function displayCurrentArticle() {
                        const article = articles[currentIndex];
                        newsContainer.innerHTML = `<a href="${article.link}" target="_blank" class="news-link">${article.title}</a>`;
                        currentIndex = (currentIndex + 1) % articles.length;
                    }

                    displayCurrentArticle();
                    setInterval(displayCurrentArticle, 6000);
                }
            } catch (error) {
                console.error("Failed to load news feed.", error)
                document.getElementById('newsContent').innerHTML = `<span class="news-link">News telemetry offline.</span>`;
            }

        }

        loadNewsFeed();

        /* --- Updated: Asynchronous Function to Fetch and Render Weather Telemetry Data using Geolocation --- */
        async function loadWeather() {
            const weatherContainer = document.getElementById('weatherWidgetContent');
            
            const fetchWeather = async (lat, lon, locationLabel) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&current_weather=true&longitude=${lon}`);
                    const data = await res.json();
                    if(data && data.current_weather) {
                        const temp = data.current_weather.temperature;
                        weatherContainer.innerHTML = `
                            <div class="weather-temp">${temp}°C</div>
                            <div>Conditions: Clear / Active</div>
                            <div>Location: ${locationLabel}</div>
                        `;
                    }
                } catch (err) {
                    weatherContainer.innerHTML = `<div>Weather telemetry offline</div>`;
                }
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        fetchWeather(lat, lon, `[${lat.toFixed(2)}, ${lon.toFixed(2)}]`);
                    },
                    (error) => {
                        console.warn("Geolocation permission denied or unavailable. Falling back to default coordinates.", error);
                        fetchWeather(40.7128, -74.0060, "[40.71, -74.01]");
                    }
                );
            } else {
                fetchWeather(40.7128, -74.0060, "[40.71, -74.01]");
            }
        }
        
        loadWeather();

        const todoInput = document.getElementById('todoInput');
        const todoAddBtn = document.getElementById('todoAddBtn');
        const todoList = document.getElementById('todoList');

        let tasks = JSON.parse(localStorage.getItem('synergy_tasks')) || [];

        function renderTasks() {
            todoList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `<span>${task}</span><button class="todo-delete" onclick="removeTask(${index})"><i class="fa-solid fa-xmark"></i></button>`;
                todoList.appendChild(li);
            });
            localStorage.setItem('synergy_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const val = todoInput.value.trim();
            if(val) {
                tasks.push(val);
                todoInput.value = '';
                renderTasks();
            }
        }

        window.removeTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        todoAddBtn.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') addTask();
        });

        renderTasks();
    </script>
</body>
</html>
